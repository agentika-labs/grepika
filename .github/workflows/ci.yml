name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  eval:
    name: Eval Scripts
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: target/pycache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          key: eval

      - name: Build release binary
        run: cargo build --release

      - name: Compile Python eval scripts
        run: python -m py_compile scripts/*.py

      - name: Run deterministic eval scripts
        run: |
          mkdir -p target/evals
          python scripts/index_update_eval.py \
            --binary target/release/grepika \
            --runs 1 \
            --git-fast-path \
            --graph-batch \
            --out target/evals/index-update.json
          python scripts/natural_search_eval.py \
            --binary target/release/grepika \
            --runs 1 \
            --out target/evals/natural-search.json
          python scripts/live_mcp_eval.py \
            --binary target/release/grepika \
            --timeout 20 \
            --json > target/evals/live-mcp.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: target/evals
